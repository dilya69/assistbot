<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="color-scheme" content="light dark">
<title>Помощник</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600&family=Unbounded:wght@400;500&family=Cormorant+SC:wght@600;700&family=EB+Garamond:wght@400;500;600&family=Oswald:wght@500;600&family=PT+Sans:wght@400;700&display=swap">
<link rel="stylesheet" href="css/theme.css?v=4">
<link rel="stylesheet" href="css/app.css?v=4">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-today" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6L7 7M17 17l1.4 1.4M18.4 5.6L17 7M7 17l-1.4 1.4"/></symbol>
  <symbol id="i-habits" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M8 12.5l2.7 2.7L16 9.5"/></symbol>
  <symbol id="i-shifts" viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="15" rx="3"/><path d="M4 10h16M8 3v4M16 3v4"/></symbol>
  <symbol id="i-cycle" viewBox="0 0 24 24"><path d="M12 3.5c3.2 3.9 5.5 6.6 5.5 9.6a5.5 5.5 0 0 1-11 0c0-3 2.3-5.7 5.5-9.6z"/></symbol>
  <symbol id="i-set" viewBox="0 0 24 24"><path d="M5 8h9M18 8h1M5 16h1M10 16h9"/><circle cx="16" cy="8" r="2"/><circle cx="8" cy="16" r="2"/></symbol>
</svg>

<div class="app" id="app">
  <div id="banner" hidden></div>

  <section class="view" id="view-today" data-tab="today">
    <div class="hd"><small id="todayDate"></small><h1>Сегодня</h1></div>
    <div id="todayBody"></div>
  </section>

  <section class="view" id="view-habits" data-tab="habits" hidden>
    <div class="hd"><h1>Привычки</h1></div>
    <div id="habitsBody"><div class="empty"><span>Загрузка...</span></div></div>
  </section>

  <section class="view" id="view-shifts" data-tab="shifts" hidden>
    <div class="hd"><h1>Смены</h1></div>
    <div id="shiftsBody"><div class="empty"><span>Загрузка...</span></div></div>
  </section>

  <section class="view" id="view-cycle" data-tab="cycle" hidden>
    <div class="hd"><h1>Цикл</h1></div>
    <div class="empty"><b>Здесь будет календарь цикла</b><span>Одна из последних вкладок</span></div>
  </section>

  <section class="view" id="view-settings" data-tab="settings" hidden>
    <div class="hd"><h1>Настройки</h1></div>
    <div id="settingsBody"></div>
  </section>

  <nav class="nav" aria-label="Разделы">
    <button type="button" data-go="today"    aria-current="page"><svg class="i"><use href="#i-today"/></svg>Сегодня</button>
    <button type="button" data-go="habits"><svg class="i"><use href="#i-habits"/></svg>Привычки</button>
    <button type="button" data-go="shifts"><svg class="i"><use href="#i-shifts"/></svg>Смены</button>
    <button type="button" data-go="cycle"><svg class="i"><use href="#i-cycle"/></svg>Цикл</button>
    <button type="button" data-go="settings"><svg class="i"><use href="#i-set"/></svg>Настройки</button>
  </nav>
</div>

<div class="toast" id="toast" role="status" hidden></div>

<script src="js/config.js?v=4"></script>
<script src="js/app.js?v=4"></script>
<script src="js/shifts.js?v=4"></script>
<script src="js/habits.js?v=4"></script>
</body>
</html>
